services:
  web:
    build: ../apps/web
    container_name: hhl-web
    environment:
      LAB_NAME: Human Hacking Lab
      SIMULATOR_URL: http://simulator:8090
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      simulator:
        condition: service_healthy
    networks: [lab]

  mail:
    image: mailhog/mailhog:v1.0.1
    container_name: hhl-mail
    ports:
      - "127.0.0.1:8025:8025"
    networks: [lab]

  simulator:
    build:
      context: ..
      dockerfile: apps/simulator/Dockerfile
    container_name: hhl-simulator
    environment:
      PORT: "8090"
      DB_PATH: /data/hhl-simulation.db
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      PUBLIC_BASE_URL: http://127.0.0.1:8080
      USERS_FILE: /app/users.csv
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - simulator-data:/data
    depends_on: [mail]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [lab]

  detection:
    build:
      context: ..
      dockerfile: apps/detection/Dockerfile
    container_name: hhl-detection
    environment:
      DB_PATH: /data/hhl-simulation.db
      PORT: "8091"
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - simulator-data:/data:ro
    depends_on:
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [lab]

  ctf:
    build:
      context: ..
      dockerfile: apps/ctf/Dockerfile
    container_name: hhl-ctf
    environment:
      TELEMETRY_DB_PATH: /telemetry/hhl-simulation.db
      CTF_DB_PATH: /data/hhl-ctf.db
      PORT: "8092"
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - simulator-data:/telemetry:ro
      - ctf-data:/data
    depends_on:
      simulator:
        condition: service_healthy
      detection:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [lab]

  assessment:
    build:
      context: ..
      dockerfile: apps/assessment/Dockerfile
    container_name: hhl-assessment
    environment:
      TELEMETRY_DB_PATH: /telemetry/hhl-simulation.db
      ASSESSMENT_DB_PATH: /data/hhl-assessment.db
      PORT: "8093"
    ports:
      - "127.0.0.1:8093:8093"
    volumes:
      - simulator-data:/telemetry:ro
      - assessment-data:/data
    depends_on:
      detection:
        condition: service_healthy
      ctf:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [lab]

networks:
  lab:
    name: hhl-isolated
    driver: bridge

volumes:
  simulator-data:
    name: hhl-simulator-data
  ctf-data:
    name: hhl-ctf-data
  assessment-data:
    name: hhl-assessment-data
