name: lab-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python
        run: python -m py_compile apps/web/app.py apps/simulator/app.py apps/detection/detector.py apps/osint/osint.py apps/appsec/appsec.py apps/hrm/hrm.py apps/blue_team/blue_team.py apps/ctf/ctf.py apps/assessment/assessment.py apps/reporting/reporting.py apps/verification/verification.py

      - name: Run artifact tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate isolated Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Start isolated lab
        run: docker compose -f infra/docker-compose.yml up --build -d

      - name: Smoke test guided dashboard
        run: python tests/smoke_dashboard.py

      - name: Stop isolated lab
        if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes

      - name: Check for obvious secret files
        run: |
          ! find . -type f \( -name "*.pem" -o -name "*.key" -o -name ".env" \) -not -path "./.git/*" | grep .
